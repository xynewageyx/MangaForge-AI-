name: Deploy MangaForge Android Web App
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mangaforge-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify TypeScript
        run: bunx tsc --noEmit
      - name: Run tests
        run: bun run test
      - name: Build Cloudflare Worker with Nitro
        run: bun run build
      - name: Check generated Cloudflare configuration
        run: |
          test -s .output/server/wrangler.json
          test -s .output/server/index.mjs
          test -d .output/public
      - name: Ensure Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi
      - name: Set a valid public Worker hostname
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const file = '.output/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.name = 'mangaforge-ai';
          config.ai = { binding: 'AI' };
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          console.log('Worker name:', config.name);
          EOF
      - name: Add Cloudflare image API entry
        run: |
          cp src/worker-image-api.mjs .output/server/worker-image-api.mjs
          cat > .output/server/mangaforge-entry.mjs <<'EOF'
          import app from './index.mjs';
          import { handleImageRequest } from './worker-image-api.mjs';
          export default {
            fetch(request, env, ctx) {
              if (new URL(request.url).pathname === '/api/generate-image') {
                return handleImageRequest(request, env);
              }
              return app.fetch(request, env, ctx);
            }
          };
          EOF
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const file = '.output/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.main = './mangaforge-entry.mjs';
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + String.fromCharCode(10));
          EOF
      - name: Deploy prebuilt Nitro app to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx nitro deploy --prebuilt
